version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: agunan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_analisa_agunan}
      MYSQL_USER: ${MYSQL_USER:-agunan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --max_connections=200
    networks:
      - agunan-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-agunan_user}", "-p${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agunan-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-Sistem Analisa Agunan Berbasis Data Pasar}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@bank.co.id}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_FULLNAME: ${INITIAL_ADMIN_FULLNAME:-Administrator Valuasi}
      INITIAL_ANALIS_USERNAME: ${INITIAL_ANALIS_USERNAME:-analis1}
      INITIAL_ANALIS_EMAIL: ${INITIAL_ANALIS_EMAIL:-analis1@bank.co.id}
      INITIAL_ANALIS_PASSWORD: ${INITIAL_ANALIS_PASSWORD:?Set INITIAL_ANALIS_PASSWORD in .env}
      INITIAL_ANALIS_FULLNAME: ${INITIAL_ANALIS_FULLNAME:-Budi Pratama (Analis Kredit)}
      INITIAL_REVIEWER_USERNAME: ${INITIAL_REVIEWER_USERNAME:-reviewer1}
      INITIAL_REVIEWER_EMAIL: ${INITIAL_REVIEWER_EMAIL:-reviewer1@bank.co.id}
      INITIAL_REVIEWER_PASSWORD: ${INITIAL_REVIEWER_PASSWORD:?Set INITIAL_REVIEWER_PASSWORD in .env}
      INITIAL_REVIEWER_FULLNAME: ${INITIAL_REVIEWER_FULLNAME:-Siti Rahayu (Reviewer Agunan)}
    networks:
      - agunan-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agunan-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api/v1
    networks:
      - agunan-net

  proxy:
    image: nginx:1.25-alpine
    container_name: agunan-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
      - "8000:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agunan-net

volumes:
  mysql_data:
    driver: local

networks:
  agunan-net:
    driver: bridge
